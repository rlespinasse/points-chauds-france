name: Refresh FIRMS Fire Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Fetch FIRMS data
        run: node scripts/fetch-firms.mjs
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/firms-france-*.geojson public/data/communes-context.geojson
          git add -A -- public/data/archive
          # commune-cache.json's lastSeen timestamps churn on almost every run
          # (5-day query window overlaps ~5/6 between 3h runs); only commit it
          # when something substantive also changed, else discard the bump.
          if git diff --staged --quiet; then
            git checkout -- data/commune-cache.json
          else
            git add data/commune-cache.json
            git commit -m "chore: refresh FIRMS fire data"
            git push
          fi
