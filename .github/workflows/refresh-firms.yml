name: Refresh FIRMS Fire Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Fetch FIRMS data
        run: node scripts/fetch-firms.mjs
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/firms-france-*.geojson public/data/communes-context.geojson data/commune-cache.json
          git add -A -- data/archive
          git diff --staged --quiet || git commit -m "chore: refresh FIRMS fire data"
          git push
