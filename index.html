<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feux de forêt en France</title>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- Mesure d'audience GoatCounter (compte « rlespinasse »), sans cookie ni
         donnée personnelle. La vue de page est envoyée automatiquement par
         count.js ; les événements d'usage sont préfixés par
         /points-chauds-france via basePath (cf. src/analytics.ts). Les hits
         depuis localhost / réseaux privés sont ignorés par défaut
         (allow_local non activé). -->
    <script
      data-goatcounter="https://rlespinasse.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
